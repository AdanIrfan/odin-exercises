<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0">
    <title>Submission form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="speaker-form-header">
        <h1>Speaker Submission</h1>
        <p><em>Want to speak at our fake conference? Fill out this form.</em></p>
    </header>

    <form action="" method="get" class="speaker-form">
        <div class="form-row">
            <label for="name">Name: *</label>
            <input type="text" id="name" name="user-name" required>

        </div>
        <div class="form-row">
            <label for="email">Email: *</label>
            <input type="email" id="email" name="user-email" placeholder="abc@gmail.com" required>
        </div>
        <fieldset class='legacy-form-row'>
            <legend>Type of Talk</legend>
            <input id='talk-type-1' name='talk-type' type='radio' value='main-stage' />
            <label for='talk-type-1' class='radio-label'>Main Stage</label>
            <input id='talk-type-2' name='talk-type' type='radio' value='workshop' checked />
            <label for='talk-type-2' class='radio-label'>Workshop</label>
        </fieldset>
        <div class = "form-row">
            <label for="t-shirt">T-shirt size</label>
            <select id = "t-shirt" name = "t-shirt">
                <option value="small">Small</option>
                <option value="extra small">Extra Small</option>
                <option value="medium">Medium</option>
            </select>
        </div>
        <div class = "form-row">
            <legend for="abstract">Abstract</legend>
            <textarea id="abstract" name = "abstract"></textarea>
            <div class='instructions'>Describe your talk in 500 words or less</div>
        </div>
        <div class = "form-row">
            <label for="availability" class = "checkbox-label">
                <input type="checkbox" id="availability" name = "available" value="is-availability">
                <span>I'm actually available the date of the talk</span></label>
        </div>
        <div class = "form-row">
            <button>submit</button>
        </div>
    </form>
</body>

</html>
