<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .ball {
      width: 50px;
      height: 50px;
      border-radius: 25px;
      background-color: red;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 1s;
    }
  </style>
  <body>
    <p>MOVE BALL</p>
    <div id="foo" class="ball"></div>
  </body>
  <script>
    const circleDiv = document.getElementById("foo");
    document.addEventListener("click", (ev) => {
      circleDiv.style.transform = `translateY(${ev.clientY - 25}px)`;
      circleDiv.style.transform += `translateX(${ev.clientX - 25}px)`;
    });
  </script>
</html>
