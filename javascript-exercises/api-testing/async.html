<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
  </head>
  <body>
    <img src="#" />
    <button type="button" id="change">change</button>
    <input type="text" name="search" placeholder="Search for a GIF" />
    <button type="button" id="search">Search</button>
    <script>
      const img = document.querySelector("img");
      const searchBtn = document.getElementById("search");
      async function fetchImage(search = "cat") {
        try {
          const link = `https://api.giphy.com/v1/gifs/translate?api_key=5hIQ4rzAAxPjQzMdqxo1pGQS6KLp5sc8&s=${encodeURIComponent(search)}&rating=g`;

          const response = await fetch(link);
          if (!response.ok) {
            throw new Error("Giphy not available");
          }
          parsedResponse = await response.json();
          img.src = parsedResponse.data.images.original.url;
        } catch (error) {
          console.error(error);
        }
      }

      searchBtn.addEventListener("click", () => {
        const input = document.querySelector("input").value.trim();
        if (input !== "") {
          fetchImage(input);
        }
      });

      fetchImage();
      const changeBtn = document.getElementById("change");
      changeBtn.addEventListener("click", fetchImage);
    </script>
  </body>
</html>
